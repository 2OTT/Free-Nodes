name: 每日节点更新

on:
  schedule:
    # 每天在北京时间上午9点运行 (UTC时间凌晨1点)
    - cron: '0 1 * * *'
  workflow_dispatch: # 允许手动触发此工作流

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行主脚本
        env:
          # 从仓库的 Secrets 中获取 YouTube API 密钥
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python main.py

      - name: 提交并推送文件变更
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # 检查目标文件是否存在，以避免在脚本失败时出错
          if [ -f "Nodes/fxrj.txt" ] || [ -f "Nodes/fxrj.yaml" ]; then
            git add Nodes/fxrj.txt Nodes/fxrj.yaml
            # 检查是否有文件变更，只有在有变更时才提交
            if ! git diff --staged --quiet; then
              git commit -m "chore: 自动更新节点文件"
              git push
            else
              echo "节点文件无变化，无需提交。"
            fi
          else
            echo "未找到节点文件，无需提交。"
          fi
