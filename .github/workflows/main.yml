name: 每日节点更新

on:
  schedule:
    # 每天北京时间上午9点运行 (UTC 时间是 1:00)
    - cron: '0 1 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    
    # 【关键修复】: 授予 Action 对仓库内容的写入权限
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖项
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行主脚本
        run: python main.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # 在 Action 环境中设置代理 (如果需要)
          # HTTPS_PROXY: ${{ secrets.PROXY_URL }} 

      - name: 提交并推送文件变更
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # 检查目标文件是否存在，以避免在脚本失败时出错
          if [ -f "Nodes/fxrj.txt" ] || [ -f "Nodes/fxrj.yaml" ]; then
            git add Nodes/fxrj.txt Nodes/fxrj.yaml
            # 检查是否有文件变更，只有在有变更时才提交
            if ! git diff --staged --quiet; then
              git commit -m "chore: 自动更新节点文件"
              git push
            else
              echo "节点文件无变化，无需提交。"
            fi
          else
            echo "未找到节点文件，无需提交。"
          fi

